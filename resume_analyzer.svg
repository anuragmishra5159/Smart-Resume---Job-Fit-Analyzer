<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7FA9C6"></stop>
      <stop offset="100%" stop-color="#9FD3B2"></stop>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"></rect>

  <!-- Main white circular badge -->
  <circle cx="256" cy="256" r="210" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="6"></circle>

  <!-- Magnifying glass -->
  <circle cx="200" cy="185" r="55" fill="none" stroke="#2B7DBF" stroke-width="10"></circle>

  <line x1="240" y1="225" x2="300" y2="285" stroke="#2B7DBF" stroke-width="12" stroke-linecap="round"></line>

  <!-- Person inside magnifier -->
  <circle cx="200" cy="170" r="10" fill="#7FA9C6"></circle>
  <path d="M185 200 Q200 185 215 200" fill="#7FA9C6"></path>

  <!-- Small blue gear -->
  <circle cx="280" cy="235" r="22" fill="none" stroke="#2B7DBF" stroke-width="6"></circle>

  <!-- Green gear -->
  <circle cx="335" cy="215" r="30" fill="none" stroke="#5FBF4A" stroke-width="8"></circle>

  <!-- Upward arrow inside green gear -->
  <path d="M325 220 L340 205 L340 215 L355 215 L355 225 L340 225 L340 235 Z" fill="#5FBF4A"></path>

  <!-- Text line 1 -->
  <text x="256" y="330" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#2B7DBF">
    RESUME &amp; JOB FIT
  </text>

  <!-- Text line 2 -->
  <text x="256" y="370" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#5FBF4A">
    ANALYSER
  </text>

</svg>
